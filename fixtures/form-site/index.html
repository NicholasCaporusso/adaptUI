<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Appointment Request — Community Accessibility Clinic</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f8fafc; color: #0f172a; }
    header { background: #1e3a8a; color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; }
    nav a { color: #bfdbfe; margin-right: 16px; text-decoration: none; }
    main { max-width: 720px; margin: 24px auto; padding: 0 16px; }
    .field { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    input[type="text"], input[type="email"], select, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
    .error { color: #b91c1c; font-size: 14px; margin-top: 4px; }
    .receipt { background: #dcfce7; border: 1px solid #16a34a; padding: 16px; border-radius: 6px; margin-top: 16px; }
  </style>
</head>
<body>
  <header>
    <strong>Community Accessibility Clinic</strong>
    <nav aria-label="Clinic navigation">
      <a href="/form/index.html">Appointment Form</a>
      <a href="/info/index.html">Research Center</a>
      <a href="/search/index.html">Publications</a>
    </nav>
  </header>

  <main>
    <h1>Request an Assistive Technology Consultation</h1>
    <p>Complete the form below to schedule a consultation. Required fields are marked.</p>

    <div id="form-error-summary" role="alert" aria-live="assertive" class="error" hidden></div>
    <div id="form-receipt" role="status" aria-live="polite" class="receipt" hidden></div>

    <form id="consultation-form" aria-label="Consultation request form" novalidate>
      <div class="field">
        <label for="full-name">Full Name (Required)</label>
        <input id="full-name" name="fullName" type="text" required aria-required="true" aria-describedby="full-name-error" placeholder="e.g., Jordan Taylor" />
        <div id="full-name-error" class="error" role="alert"></div>
      </div>

      <div class="field">
        <label for="email">Email Address (Required)</label>
        <input id="email" name="email" type="email" required aria-required="true" aria-describedby="email-error" placeholder="e.g., jordan@example.com" />
        <div id="email-error" class="error" role="alert"></div>
      </div>

      <div class="field">
        <label for="department">Support Department</label>
        <select id="department" name="department">
          <option value="eye-gaze">Eye-Gaze &amp; Tracking Lab</option>
          <option value="switch-access">Switch Access Clinic</option>
          <option value="keyboard-voice">Keyboard &amp; Text Commands</option>
        </select>
      </div>

      <fieldset class="field">
        <legend>Preferred Contact Method</legend>
        <label><input type="radio" name="contactMethod" value="email" checked /> Email</label>
        <label><input type="radio" name="contactMethod" value="phone" /> Phone / Relay</label>
      </fieldset>

      <div class="field">
        <label for="notes">Additional Notes</label>
        <textarea id="notes" name="notes" rows="3" placeholder="Share any assistive devices or preferences..."></textarea>
      </div>

      <div class="field">
        <label>
          <input id="consent-checkbox" name="consent" type="checkbox" required aria-required="true" />
          I consent to the clinic contacting me regarding this appointment (Required)
        </label>
        <div id="consent-error" class="error" role="alert"></div>
      </div>

      <button type="submit" id="submit-appointment">Submit Appointment Request</button>
      <button type="button" id="reset-form">Clear Form</button>
    </form>
  </main>

  <script>
    const form = document.getElementById("consultation-form");
    const nameInput = document.getElementById("full-name");
    const emailInput = document.getElementById("email");
    const deptSelect = document.getElementById("department");
    const consentInput = document.getElementById("consent-checkbox");
    const summaryEl = document.getElementById("form-error-summary");
    const receiptEl = document.getElementById("form-receipt");

    function clearErrors() {
      document.getElementById("full-name-error").textContent = "";
      document.getElementById("email-error").textContent = "";
      document.getElementById("consent-error").textContent = "";
      summaryEl.textContent = "";
      summaryEl.hidden = true;
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      clearErrors();
      receiptEl.hidden = true;

      const errors = [];
      if (!nameInput.value.trim()) {
        document.getElementById("full-name-error").textContent = "Full Name is required.";
        errors.push("Full Name is required.");
      }
      if (!emailInput.value.trim() || !emailInput.value.includes("@")) {
        document.getElementById("email-error").textContent = "Please enter a valid Email Address.";
        errors.push("Valid Email Address is required.");
      }
      if (!consentInput.checked) {
        document.getElementById("consent-error").textContent = "Consent is required before submitting.";
        errors.push("Consent checkbox must be checked.");
      }

      if (errors.length > 0) {
        summaryEl.textContent = `Please correct ${errors.length} error(s): ${errors.join(" ")}`;
        summaryEl.hidden = false;
        return;
      }

      const method = form.querySelector('input[name="contactMethod"]:checked')?.value || "email";
      document.cookie = `last_appointment_name=${encodeURIComponent(nameInput.value.trim())}; path=/`;
      receiptEl.textContent = `Appointment request submitted for ${nameInput.value.trim()} (${emailInput.value.trim()}) in ${deptSelect.value} via ${method}. Confirmation #APT-2026-042.`;
      receiptEl.hidden = false;
    });

    document.getElementById("reset-form").addEventListener("click", () => {
      form.reset();
      clearErrors();
      receiptEl.hidden = true;
    });
  </script>
</body>
</html>
